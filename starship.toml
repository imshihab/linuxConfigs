# Minimal prompt setup for a dark terminal.
# Keep the prompt responsive and easy to read.
scan_timeout = 30
command_timeout = 2000

palette = "custom"

# Main prompt layout: left side on top, status and prompt symbol at the bottom.
format = """
[╭─](fg:gray)\
[](fg:blue)\
$os\
$username\
$sudo\
$directory\
$git_branch\
$git_status\
$git_metrics\
$package\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$python\
$docker_context\
$conda\
[](fg:prev_bg)\
$fill\
$battery\
$memory_usage\
$cmd_duration\
$jobs\
[](fg:bg)\
$time\
[](fg:bg)\
[─╮](fg:gray)
[│](fg:gray)
[╰─](fg:gray)\
$status\
$character"""

# The bar that fills the space between the left and right sections.
[fill]
symbol = "─"
style = "fg:gray"

# Core colors used across the prompt.
[palettes.custom]
fg = "#F8FAFC"
yellow = "#FACC15"
blue = "#2563EB"
green = "#22C55E"
red = "#DC2626"
dark_blue = "#1D4ED8"
dark_green = "#15803D"
dark_red = "#991B1B"
bg = "#111827"
gray = "#374151"
purple = "#9333EA"

[os]
disabled = false
style = "bg:blue fg:fg"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Fedora = "󰣛"
Arch = "󰣇"
Debian = "󰣚"
Linux = "󰌽"
Macos = "󰀵"
Unknown = ""

# Show the current user, even in non-root shells.
[username]
show_always = true
style_user = "bg:blue fg:fg"
style_root = "bg:red fg:fg"
format = "[  $user ]($style)"

# Path display with a compact truncation style.
[directory]
style = "bg:yellow fg:bg"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰉍 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "󰉏 Pictures"
"Videos" = "󰕧 Videos"
"Projects" = "󰲋 Projects"
"Desktop" = "󰇄 Desktop"

# Git details and status markers.
[git_branch]
symbol = ""
style = "bg:blue fg:fg"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:blue fg:fg"
format = "[$all_status$ahead_behind ]($style)"

conflicted = "󰞇 "
ahead = "󰜷 "
behind = "󰜮 "
diverged = "󰹹 "
up_to_date = "󰄬 "
untracked = "󰋖 "
stashed = "󰏗 "
modified = "󰏫 "
staged = "󰐕 "
renamed = "󰁕 "
deleted = "󰆴 "

[git_metrics]
disabled = false
added_style = "bg:green fg:fg"
deleted_style = "bg:red fg:fg"
format = "[ +$added ]($added_style)[ -$deleted ]($deleted_style)"

[package]
disabled = false
symbol = "󰏗 "
style = "bg:purple fg:fg"
format = "[ $symbol$version ]($style)"

[c]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[php]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "bg:green fg:fg"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = ""
style = "bg:gray fg:fg"
format = "[ $symbol $context ]($style)"

[conda]
symbol = "🅒"
style = "bg:gray fg:fg"
format = "[ $symbol $environment ]($style)"

# Battery state and memory usage for the right side of the prompt.
[battery]
disabled = false
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 20
style = "bold fg:red"

[[battery.display]]
threshold = 50
style = "fg:yellow"

[[battery.display]]
threshold = 100
style = "fg:green"

[memory_usage]
disabled = false
threshold = 60
symbol = "󰍛 "
style = "fg:yellow"
format = "[ $symbol$ram_pct ]($style)"

[cmd_duration]
min_time = 2000
format = "[ 󱎫 $duration ]($style)"
style = "fg:yellow"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:bg fg:fg"
format = "[ $time]($style)"

[jobs]
symbol = "󰠥"
style = "bg:bg fg:blue"
format = "[ $symbol $number ]($style)"

[sudo]
disabled = false
symbol = "󰌆"
style = "bold bg:bg fg:red"
format = "[ $symbol ]($style)"

[line_break]
disabled = false

[status]
disabled = false
format = '[ \[ $symbol $status \] ]($style)'
symbol = "󰅙"
style = "bold fg:red"
success_symbol = "󰄬"
map_symbol = true

# Extra shell-specific indicators for the active terminal.
[shell]
disabled = false
format = "[$indicator]($style) "
bash_indicator = "[bash](bold green)"
zsh_indicator = "[zsh](bold cyan)"
fish_indicator = "[fish](bold blue)"
powershell_indicator = "[pwsh](bold purple)"
unknown_indicator = "[shell](bold yellow)"

# Small prompt polish for multi-line shell input.
continuation_prompt = "[∙](bold fg:gray) "

[character]
disabled = false
success_symbol = '[\$ ](bold fg:green)'
error_symbol = '[\$ ](bold fg:red)'
vimcmd_symbol = '[\$ ](bold fg:green)'
